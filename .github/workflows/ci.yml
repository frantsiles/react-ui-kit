name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9.8.0
          run_install: false

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec cypress install
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm typecheck
      - run: pnpm exec nx run-many -t lint test build e2e
      # Si falla la regresión visual: capturas actuales y diferencias
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regresion-visual
          path: apps/storybook/.vitest-attachments/
          if-no-files-found: ignore
